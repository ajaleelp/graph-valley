<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Valley — learn anything, one island at a time</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
</head>
<body>

  <!-- ============ HOME ============ -->
  <main id="screen-home" class="screen active">
    <div class="gem g1"></div><div class="gem g2"></div><div class="gem g3"></div>
    <div class="gem g4"></div><div class="gem g5"></div>
    <section class="hero">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,2 38,12 20,22 2,12" fill="#f4a28e"/>
        <polygon points="2,12 20,22 20,38 2,28" fill="#d97f6b"/>
        <polygon points="38,12 20,22 20,38 38,28" fill="#b85f4e"/>
      </svg>
      <h1>What do you want<br />to learn today?</h1>
      <p class="sub">Type anything. We chart the path. You walk it.</p>
      <form id="topic-form" autocomplete="off">
        <input id="topic-input" type="text" maxlength="200"
               placeholder="e.g. how black holes work, sourdough, the French Revolution…" />
        <button id="btn-begin" type="submit" class="primary">Begin</button>
      </form>
      <div id="chips">
        <button class="chip" data-topic="How black holes work">black holes</button>
        <button class="chip" data-topic="How to bake sourdough bread">sourdough</button>
        <button class="chip" data-topic="Conversational Japanese for travel">japanese</button>
        <button class="chip" data-topic="How the stock market works">the stock market</button>
      </div>
      <button id="resume" class="hidden">Continue journey: <span id="resume-title"></span></button>
    </section>
  </main>

  <!-- ============ LOADING ============ -->
  <div id="screen-loading" class="screen">
    <div class="loader">
      <svg class="mark spin" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,2 38,12 20,22 2,12" fill="#f4a28e"/>
        <polygon points="2,12 20,22 20,38 2,28" fill="#d97f6b"/>
        <polygon points="38,12 20,22 20,38 38,28" fill="#b85f4e"/>
      </svg>
      <p id="loading-msg">Reading your goal…</p>
    </div>
  </div>

  <!-- ============ WORLD ============ -->
  <div id="screen-world" class="screen">
    <header id="hud">
      <button id="btn-home" title="Start a new journey">‹ New</button>
      <div id="hud-center">
        <div id="hud-title">—</div>
        <div id="hud-bar"><i id="hud-fill"></i></div>
      </div>
      <span id="demo-badge" class="hidden" title="You're seeing built-in demo content. Restart the server with ANTHROPIC_API_KEY or OPENAI_API_KEY set for fully AI-generated journeys.">demo</span>
      <span id="hud-count">0/0</span>
      <button id="btn-fit" title="Fit the whole world on screen">Fit</button>
    </header>

    <svg id="world" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport">
        <g id="world-structure"></g>
        <g id="avatar" transform="translate(0 0)">
          <ellipse class="av-glow" cx="0" cy="-18" rx="21" ry="21" fill="url(#avatarGlow)" />
          <ellipse class="av-shadow" rx="10" ry="4" cx="0" cy="4" />
          <g class="av-bob">
            <path class="av-robe" d="M0,-31 C7.5,-31 12,-25 13,-17 L15.5,-3 C16,1.5 9,4 0,4 C-9,4 -16,1.5 -15.5,-3 L-13,-17 C-12,-25 -7.5,-31 0,-31 Z" fill="#f7f2e6" />
            <path class="av-shade" d="M2,-30 C8,-29 12,-24 13,-17 L15,-3 C13,-1 7,0 2,0 Z" fill="#e3dac4" opacity="0.8" />
            <circle class="av-face" cx="0" cy="-16" r="5" fill="#37344a" />
            <polygon class="av-hat" points="0,-47 7,-28 -7,-28" fill="#f7f2e6" />
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- ============ PATH CHOICE (Monument Valley style) ============ -->
  <div id="choice" class="hidden">
    <div id="choice-bubble">
      <div id="choice-text"></div>
      <div id="choice-list"></div>
    </div>
    <div id="choice-tail"></div>
  </div>

  <!-- ============ LESSON SHEET ============ -->
  <div id="modal-backdrop">
    <div id="sheet" role="dialog" aria-modal="true">
      <button id="sheet-close" title="Close">×</button>
      <div id="sheet-kicker">LESSON</div>
      <h2 id="sheet-title"></h2>
      <p id="sheet-summary"></p>
      <div id="sheet-content"></div>
      <div id="sheet-check" class="hidden">
        <h3>Quick check</h3>
        <p id="check-q"></p>
        <div id="check-opts"></div>
        <p id="check-expl" class="hidden"></p>
        <button id="check-continue" class="primary hidden">Continue journey →</button>
      </div>
    </div>
  </div>

  <!-- ============ CELEBRATION ============ -->
  <div id="cel-overlay" class="hidden">
    <div id="cel-card">
      <svg class="mark big" viewBox="0 0 40 40" aria-hidden="true">
        <polygon points="20,2 38,12 20,22 2,12" fill="#f2c94c"/>
        <polygon points="2,12 20,22 20,38 2,28" fill="#d4ad3f"/>
        <polygon points="38,12 20,22 20,38 38,28" fill="#a9852e"/>
      </svg>
      <h2>You reached the summit</h2>
      <p id="cel-sub">You completed <strong><span id="cel-title"></span></strong>. Every island below is yours now.</p>
      <ol id="recap"></ol>
      <div class="row">
        <button id="btn-again" class="primary">Learn something new</button>
        <button id="btn-stay" class="ghost">Keep wandering</button>
      </div>
    </div>
  </div>

  <div id="confetti"></div>
  <div id="toast"></div>

</body>
</html>
