<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Graph Valley — learn anything, one monument at a time</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>

  <!-- ============ HOME ============ -->
  <main id="screen-home" class="screen active">
    <div class="home-sky" aria-hidden="true">
      <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
    </div>
    <section class="hero">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,4 62,20 32,36 2,20" fill="#fbeedd"/>
        <polygon points="2,20 32,36 32,60 2,44" fill="#eec49f"/>
        <polygon points="62,20 32,36 32,60 62,44" fill="#d79a72"/>
        <polygon points="32,4 47,12 32,20 17,12" fill="#4fb3a5" opacity="0.9"/>
      </svg>
      <h1>What do you want<br />to learn today?</h1>
      <p class="sub">Type anything. We carve the path. You walk it.</p>
      <form id="topic-form" autocomplete="off">
        <input id="topic-input" type="text" maxlength="200"
               placeholder="e.g. how black holes work, sourdough, the French Revolution…" />
        <button id="btn-begin" type="submit" class="primary">Begin</button>
      </form>
      <div id="chips">
        <button class="chip" data-topic="How black holes work">black holes</button>
        <button class="chip" data-topic="How to bake sourdough bread">sourdough</button>
        <button class="chip" data-topic="Conversational Japanese for travel">japanese</button>
        <button class="chip" data-topic="How the stock market works">the stock market</button>
      </div>
      <button id="resume" class="hidden">Continue journey: <span id="resume-title"></span></button>
    </section>
  </main>

  <!-- ============ LOADING ============ -->
  <div id="screen-loading" class="screen">
    <div class="loader">
      <svg class="mark spin" viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,4 62,20 32,36 2,20" fill="#fbeedd"/>
        <polygon points="2,20 32,36 32,60 2,44" fill="#eec49f"/>
        <polygon points="62,20 32,36 32,60 62,44" fill="#d79a72"/>
      </svg>
      <p id="loading-msg">Reading your goal…</p>
    </div>
  </div>

  <!-- ============ WORLD ============ -->
  <div id="screen-world" class="screen">
    <div id="sky" aria-hidden="true">
      <i id="sun"></i>
      <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i>
    </div>

    <header id="hud">
      <button id="btn-home" title="Start a new journey">New</button>
      <div id="hud-center">
        <div id="hud-title">—</div>
        <div id="hud-bar"><i id="hud-fill"></i></div>
      </div>
      <span id="demo-badge" class="hidden"
            title="Built-in demo content. Restart the server with ANTHROPIC_API_KEY or OPENAI_API_KEY set for fully AI-generated journeys.">demo</span>
      <span id="hud-count">0/0</span>
      <button id="btn-here" title="Go to the next open monument">Next</button>
      <button id="btn-fit" title="Fit the whole world on screen (F)">Fit</button>
    </header>

    <svg id="world" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="lampGlow">
          <stop offset="0" stop-color="#fff6dd" stop-opacity="0.95"/>
          <stop offset="0.45" stop-color="#ffe3a8" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#ffe3a8" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="viewport">
        <g id="world-structure"></g>
        <!-- the traveller: drawn last so she is never lost inside the stone -->
        <g id="avatar">
          <ellipse class="av-lamp" cx="0" cy="-24" rx="26" ry="26" fill="url(#lampGlow)" />
          <ellipse class="av-shadow" cx="0" cy="1" rx="11" ry="5" />
          <g class="av-body">
            <circle class="av-face" cx="0" cy="-32" r="5.6" />
            <path class="av-robe" d="M0,-29 C7.5,-29 11.5,-23 12.5,-16 L14.5,-3 C15,1 8,3 0,3 C-8,3 -15,1 -14.5,-3 L-12.5,-16 C-11.5,-23 -7.5,-29 0,-29 Z" />
            <path class="av-shade" d="M1.4,-28.8 C8,-28 11.5,-23 12.5,-16 L14.5,-3 C12.5,-0.6 6,0.6 1.4,0.6 Z" />
            <polygon class="av-hat" points="0,-57 10,-38.5 -10,-38.5" />
            <polygon class="av-hat-shade" points="0,-57 10,-38.5 0,-38.5" />
            <rect class="av-brim" x="-11" y="-39.2" width="22" height="2.8" rx="1.4" />
          </g>
        </g>
      </g>
    </svg>

    <div id="labels"></div>
  </div>

  <!-- ============ PATH CHOICE ============ -->
  <div id="choice" class="hidden">
    <div id="choice-bubble">
      <div id="choice-text"></div>
      <div id="choice-list"></div>
    </div>
    <div id="choice-tail"></div>
  </div>

  <!-- ============ LESSON SHEET ============ -->
  <div id="modal-backdrop">
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button id="sheet-close" title="Close" aria-label="Close">×</button>
      <div id="sheet-kicker">LESSON</div>
      <h2 id="sheet-title"></h2>
      <p id="sheet-summary"></p>
      <div id="sheet-content"></div>
      <div id="sheet-check" class="hidden">
        <h3>Quick check</h3>
        <p id="check-q"></p>
        <div id="check-opts"></div>
        <p id="check-expl" class="hidden"></p>
        <button id="check-continue" class="primary hidden">Continue journey →</button>
      </div>
    </div>
  </div>

  <!-- ============ CELEBRATION ============ -->
  <div id="cel-overlay" class="hidden">
    <div id="cel-card">
      <svg class="mark big" viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,4 62,20 32,36 2,20" fill="#fdf0c8"/>
        <polygon points="2,20 32,36 32,60 2,44" fill="#f2cc63"/>
        <polygon points="62,20 32,36 32,60 62,44" fill="#d9a63c"/>
      </svg>
      <h2>You reached the summit</h2>
      <p id="cel-sub">You completed <strong><span id="cel-title"></span></strong>. Every stone below is yours now.</p>
      <ol id="recap"></ol>
      <div class="row">
        <button id="btn-again" class="primary">Learn something new</button>
        <button id="btn-stay" class="ghost">Keep wandering</button>
      </div>
    </div>
  </div>

  <div id="confetti"></div>
  <div id="toast"></div>

</body>
</html>
